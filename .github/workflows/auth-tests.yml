name: Validate Meridian private access
on:
  push:
    branches: [main, fix/windows-upgrade-and-signin-v0214]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Use a stable image and its installed Chrome; avoid a second OS/browser install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python code
        run: python -m compileall -q meridian.py auth.py goal_guidance.py github_access.py suggestions.py tests/
      - name: Run all tests (offline, mocked email delivery)
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript entry points
        run: |
          node --check static/app.js
          node --check static/goals.js
          node --check static/connections.js
          node --check static/suggestions.js
          node --check static/auth.js
      - name: Ensure private data is not committed
        run: |
          if git ls-files | grep -Ei '(^|/)(github-credentials\.json|auth\.json|\.env|secrets\.json|meridian\.sqlite3)(/|$)'; then
            echo 'Private owner data was committed' >&2
            exit 1
          fi
      - name: Check analytics calculations
        run: node tests/metrics.test.cjs
      - name: Install browser test tooling (not shipped)
        run: npm install --no-save --ignore-scripts playwright@1.58.2
      - name: Verify real browser setup, sign-in, layouts and quiet behavior
        run: |
          meridian_browser_path="$(command -v google-chrome)"
          "$meridian_browser_path" --version
          MERIDIAN_CHROME_EXECUTABLE="$meridian_browser_path" node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meridian-UI-checks
          path: test-artifacts/
