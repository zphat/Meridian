name: Build, test and publish Meridian for Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: meridian-windows-release
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Generate Windows icon assets
        run: |
          python -m pip install "Pillow>=11,<13"
          python tools/generate_icons.py
      - name: Check source completeness
        shell: pwsh
        run: |
          if((Get-Content installer-go/main.go -Raw) -notmatch 'appVersion="0.2.14"'){throw "Installer internal version does not match release"}
          $needed=@("meridian.py","auth.py","static/auth.html","static/auth-complete.html","static/auth.css","static/auth.js","static/app.js","static/index.html","static/styles.css","static/favicon.svg","launcher-go/main.go","installer-go/main.go","assets/meridian.png","assets/meridian.ico")
          foreach($p in $needed){ if(!(Test-Path $p)){throw "Missing $p — do not publish incomplete installer."} }
      - name: Test Python
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check static/app.js
          node --check static/auth.js
          node --check static/app.js
      - name: Embed Meridian asterisk in both Windows executable icons
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc=Join-Path (go env GOPATH) 'bin/rsrc.exe'
          if(-not (Test-Path $rsrc)){throw "Windows icon resource compiler missing"}
          & $rsrc -arch amd64 -ico assets/meridian.ico -o launcher-go/rsrc_windows_amd64.syso
          if($LASTEXITCODE -ne 0){throw "Could not embed launcher icon"}
          & $rsrc -arch amd64 -ico assets/meridian.ico -o installer-go/rsrc_windows_amd64.syso
          if($LASTEXITCODE -ne 0){throw "Could not embed installer icon"}
      - name: Build native Windows launcher
        shell: pwsh
        run: |
          $env:GOOS="windows";$env:GOARCH="amd64";$env:CGO_ENABLED="0";$env:GO111MODULE="on"
          Push-Location launcher-go
          go mod tidy
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../Meridian.exe .
          Pop-Location
      - name: Build embedded app archive
        shell: pwsh
        run: |
          @'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          r=Path('.')
          with ZipFile('installer-go/payload.zip','w',ZIP_DEFLATED,compresslevel=9) as z:
              for f in ['meridian.py','auth.py','Meridian.exe'] + [p.as_posix() for folder in ('assets','static') for p in (r/folder).rglob('*') if p.is_file()]:
                  z.write(f,f)
          '@ | python -
      - name: Build installer executable
        shell: pwsh
        run: |
          $env:GOOS="windows";$env:GOARCH="amd64";$env:CGO_ENABLED="0";$env:GO111MODULE="off"
          Push-Location installer-go
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../Meridian-Setup-0.2.14.exe .
          Pop-Location
      - name: Confirm installer PE format
        shell: pwsh
        run: |
          $f=Get-Item Meridian-Setup-0.2.14.exe
          if($f.Length -lt 1000000){throw "Installer unexpectedly small"}
          $bytes=[IO.File]::ReadAllBytes($f.FullName)
          if($bytes[0] -ne 77 -or $bytes[1] -ne 90){throw "Not a Windows PE executable"}
      - name: Confirm both Windows EXE files contain Meridian's icon
        shell: pwsh
        run: |
          python -m pip install pefile
          @'
          import pefile
          for path in ('Meridian.exe','Meridian-Setup-0.2.14.exe'):
              exe=pefile.PE(path)
              entries=getattr(exe,'DIRECTORY_ENTRY_RESOURCE',None)
              if entries is None or not any(e.id==14 for e in entries.entries):
                  raise SystemExit(path+' does not contain a Windows application icon')
              print(path,'contains Windows application icon')
          '@ | python -
      - name: Install and smoke test on Windows
        shell: pwsh
        run: |
          $installer=Join-Path (Get-Location) 'Meridian-Setup-0.2.14.exe'
          $install=Start-Process -FilePath $installer -ArgumentList '--silent' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          $root=Join-Path $env:LOCALAPPDATA 'Programs/Meridian'
          foreach($f in @('Meridian.exe','meridian.py','auth.py','runtime/python.exe','Uninstall-Meridian.exe','static/app.js','static/auth.html','static/auth-complete.html','static/auth.css','static/auth.js','static/styles.css')) {
            if (-not (Test-Path (Join-Path $root $f))) { throw "Missing installed file: $f" }
          }
          # A magic link must open the installed app, not another browser tab.
          # Inspect and validate the exact per-user app link association.
          reg query "HKCU\Software\Classes\meridian" /s
          if($LASTEXITCODE -ne 0){throw 'Meridian protocol registration missing'}
          $protocolKey='HKCU:\Software\Classes\meridian'
          if(-not (Test-Path (Join-Path $protocolKey 'shell\open\command'))){throw 'Meridian desktop link protocol command missing'}
          $registration=(Get-Item (Join-Path $protocolKey 'shell\open\command')).GetValue('')
          if($registration -notmatch 'Meridian.exe' -or $registration -notmatch '%1'){throw 'Meridian desktop protocol is not associated with the installed launcher'}
          Write-Host 'Meridian desktop email-link association verified'
          # Verify the REAL .lnk, not merely an icon resource embedded in the EXE.
          $desktop=[Environment]::GetFolderPath('DesktopDirectory')
          $link=Join-Path $desktop 'Meridian.lnk'
          if(-not(Test-Path -LiteralPath $link)){throw "Installed desktop Meridian shortcut missing"}
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($link)
          if(-not($shortcut.TargetPath -like '*\Programs\Meridian\Meridian.exe')){throw "Desktop shortcut still points to an old Meridian executable: $($shortcut.TargetPath)"}
          if($shortcut.IconLocation -notmatch 'meridian-desktop-2026.ico'){throw "Shortcut still uses the old Windows icon: $($shortcut.IconLocation)"}
          $newIcon=Join-Path $root 'assets/meridian-desktop-2026.ico'
          if(-not(Test-Path $newIcon)){throw "Versioned Meridian desktop icon missing from installation"}
          $v=(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Meridian').DisplayVersion
          if($v -ne '0.2.14'){throw "Installed version metadata incorrect: $v"}
          Write-Host "Verified installed desktop shortcut icon, executable target, and internal version 0.2.14"

          $py=Join-Path $root 'runtime/python.exe'
          $app=Join-Path $root 'meridian.py'
          $proc=Start-Process -FilePath $py -ArgumentList @("`"$app`"",'--offline','--no-browser','--no-tray','--port','18765') -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'meridian-stdout.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'meridian-stderr.txt')
          try {
            $healthy=$false
            for($i=0;$i -lt 45;$i++) {
              Start-Sleep -Seconds 1
              try {
                $h=Invoke-RestMethod 'http://127.0.0.1:18765/api/health' -TimeoutSec 2
                if ($h.ok -and $h.version -eq '0.2.14') {$healthy=$true;break}
              } catch {}
            }
            if (-not $healthy) {
              Write-Host 'Meridian embedded runtime diagnostics:'
              Get-Content (Join-Path $env:RUNNER_TEMP 'meridian-stderr.txt') -ErrorAction SilentlyContinue
              Get-Content (Join-Path $env:RUNNER_TEMP 'meridian-stdout.txt') -ErrorAction SilentlyContinue
              throw 'Installed Meridian failed HTTP health check'
            }
            if(-not (Test-Path (Join-Path $root 'static/auth-complete.html'))){throw 'Missing browser email approval page'}
            $auth=Invoke-RestMethod 'http://127.0.0.1:18765/api/auth/status'
            if ($auth.configured) {throw 'Fresh installation must request owner setup'}
            $login=Invoke-WebRequest 'http://127.0.0.1:18765/' -UseBasicParsing
            if ($login.Content -notmatch 'Sign in to Meridian'){throw 'Sign-in page missing'}
            try {
              Invoke-RestMethod 'http://127.0.0.1:18765/api/state' -ErrorAction Stop | Out-Null
              throw 'Private dashboard accessible without a session'
            } catch {
              if ($_.Exception.Response.StatusCode -ne [System.Net.HttpStatusCode]::Unauthorized){throw}
            }
            Write-Host 'Private dashboard blocked before sign-in'
          } finally { Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue }
      - name: Verify reinstalls stop old background Meridian and show setup
        shell: pwsh
        run: |
          $root=Join-Path $env:LOCALAPPDATA 'Programs/Meridian'
          $py=Join-Path $root 'runtime/python.exe'
          $app=Join-Path $root 'meridian.py'
          $installer=Join-Path (Get-Location) 'Meridian-Setup-0.2.14.exe'
          $old=Start-Process -FilePath $py -ArgumentList @("`"$app`"",'--offline','--no-browser','--no-tray','--port','8765') -PassThru -WindowStyle Hidden
          try {
            $started=$false
            for($j=0;$j -lt 40;$j++) {
              Start-Sleep -Milliseconds 500
              try {$h=Invoke-RestMethod 'http://127.0.0.1:8765/api/health' -TimeoutSec 1; if($h.version -eq '0.2.14') {$started=$true;break}} catch {}
            }
            if(-not $started){throw 'Pre-upgrade Meridian did not start'}
            $upgrade=Start-Process -FilePath $installer -ArgumentList '--silent' -Wait -PassThru
            if($upgrade.ExitCode -ne 0){throw "Upgrade returned $($upgrade.ExitCode)"}
            $old.Refresh()
            if(-not $old.HasExited){throw 'Installer failed to terminate running Meridian backend'}
            $new=Start-Process -FilePath $py -ArgumentList @("`"$app`"",'--offline','--no-browser','--no-tray','--port','8765') -PassThru -WindowStyle Hidden
            try {
              $ready=$false
              for($j=0;$j -lt 40;$j++) {
                Start-Sleep -Milliseconds 500
                try {$h=Invoke-RestMethod 'http://127.0.0.1:8765/api/health' -TimeoutSec 1; if($h.version -eq '0.2.14') {$ready=$true;break}} catch {}
              }
              if(-not $ready){throw 'New Meridian did not restart'}
              $state=Invoke-RestMethod 'http://127.0.0.1:8765/api/auth/status'
              if($state.configured -or -not $state.local_setup){throw 'New Meridian did not expose first-run setup'}
              $login=Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing
              if($login.Content -notmatch 'Sign in to Meridian'){throw 'First-run setup UI missing after reinstall'}
              Write-Host 'Reinstall process cleanup and first-run setup verified'
            } finally {Stop-Process -Id $new.Id -ErrorAction SilentlyContinue}
          } finally {Stop-Process -Id $old.Id -ErrorAction SilentlyContinue}
      - name: Verify clicking an emailed desktop link unlocks the installed app
        shell: pwsh
        run: |
          $root=Join-Path $env:LOCALAPPDATA 'Programs/Meridian'
          $py=Join-Path $root 'runtime/python.exe'
          $app=Join-Path $root 'meridian.py'
          $launcher=Join-Path $root 'Meridian.exe'
          $server=Start-Process -FilePath $py -ArgumentList @("`"$app`"",'--offline','--no-browser','--no-tray','--port','8765') -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            for($j=0;$j -lt 40;$j++) {
              Start-Sleep -Milliseconds 500
              try {$h=Invoke-RestMethod 'http://127.0.0.1:8765/api/health' -TimeoutSec 1; if($h.version -eq '0.2.14'){$ready=$true;break}} catch {}
            }
            if(-not $ready){throw 'Installed Meridian service did not start'}
            # Generate a real one-time challenge/token in the installed database.
            # All mail delivery is mocked locally; no Resend secrets or emails are involved.
            $script=@'
          from meridian import Meridian
          app=Meridian(start_worker=False)
          challenge='B'*43
          app.auth.configure('desktop-ci@example.test','test-password-123!','re_ci_mock_key_123456789')
          links=[]
          app.auth.issue_link('desktop-ci@example.test','test-password-123!','http://127.0.0.1:8765',lambda cfg,link:links.append(link),challenge=challenge)
          print('meridian://approve?token='+links[0].split('token=')[1])
          app.close()
          '@
            Push-Location $root
            try { $deep=(& python -c $script | Out-String).Trim() } finally { Pop-Location }
            if(-not $deep.StartsWith('meridian://approve?token=')){throw "Could not generate desktop protocol token: $deep"}
            $handler=Start-Process -FilePath $launcher -ArgumentList $deep -PassThru -WindowStyle Hidden
            if(-not $handler.WaitForExit(15000)){Stop-Process -Id $handler.Id -Force -ErrorAction SilentlyContinue; throw 'Desktop magic-link handler hung'}
            if($handler.ExitCode -ne 0){throw "Windows desktop magic-link handler returned $($handler.ExitCode)"}
            $web=New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $body=@{challenge=('B'*43)} | ConvertTo-Json -Compress
            $result=Invoke-RestMethod 'http://127.0.0.1:8765/api/auth/handoff' -Method Post -ContentType 'application/json' -Body $body -WebSession $web
            if(-not $result.authenticated){throw 'Desktop sign-in challenge was not approved by the installed launcher'}
            $auth=Invoke-RestMethod 'http://127.0.0.1:8765/api/auth/status' -WebSession $web
            if(-not $auth.authenticated){throw 'Desktop window did not receive an authenticated session'}
            Write-Host 'Custom email URL protocol and installed desktop sign-in handoff PASSED'
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Verify native Meridian window owns its taskbar icon
        shell: pwsh
        run: |
          $launcher=Join-Path $env:LOCALAPPDATA 'Programs/Meridian/Meridian.exe'
          $p=Start-Process -FilePath $launcher -PassThru
          try {
            $handle=[IntPtr]::Zero
            for($n=0;$n -lt 50;$n++){
              Start-Sleep -Milliseconds 400
              $p.Refresh()
              if($p.HasExited){throw "Native Meridian window exited unexpectedly"}
              $handle=$p.MainWindowHandle
              if($handle -ne [IntPtr]::Zero){break}
            }
            if($handle -eq [IntPtr]::Zero){throw "Meridian did not create its own native taskbar window"}
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class MeridianWindowTest {
            [DllImport("user32.dll",EntryPoint="SendMessageW")]
            public static extern IntPtr SendMessage(IntPtr hWnd, UInt32 msg, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll",EntryPoint="GetClassLongPtrW")]
            public static extern IntPtr GetClassLongPtr(IntPtr hWnd,int index);
          }
          '@
            $icon=[MeridianWindowTest]::SendMessage($handle,0x7F,[IntPtr]1,[IntPtr]::Zero)
            if($icon -eq [IntPtr]::Zero){$icon=[MeridianWindowTest]::GetClassLongPtr($handle,-14)}
            if($icon -eq [IntPtr]::Zero){throw "Native Meridian window has no Windows icon assigned"}
            Write-Host "Native Meridian window and taskbar icon verified"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-Windows
          path: Meridian-Setup-0.2.14.exe
  release:
    if: github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Meridian-Windows
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="v0.2.14"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" Meridian-Setup-0.2.14.exe --repo "$repo" --clobber
          else
            gh release create "$tag" Meridian-Setup-0.2.14.exe --repo "$repo" --target "${{ github.sha }}" --title "Meridian $tag" --notes "Windows installer built and smoke-tested on Windows. Changes include status lights, 48-hour checks, downloads, simplified goals, and repair prompts."
          fi
