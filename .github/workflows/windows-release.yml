name: Build, test and publish Meridian for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check source completeness
        shell: pwsh
        run: |
          $needed=@("meridian.py","static/app.js","static/index.html","static/styles.css","static/favicon.svg","launcher-go/main.go","installer-go/main.go")
          foreach($p in $needed){ if(!(Test-Path $p)){throw "Missing $p — do not publish incomplete installer."} }
      - name: Test Python
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check static/app.js
      - name: Build native Windows launcher
        shell: pwsh
        run: |
          $env:GOOS="windows";$env:GOARCH="amd64";$env:CGO_ENABLED="0";$env:GO111MODULE="off"
          Push-Location launcher-go
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../Meridian.exe .
          Pop-Location
      - name: Build embedded app archive
        shell: pwsh
        run: |
          @'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          r=Path('.')
          with ZipFile('installer-go/payload.zip','w',ZIP_DEFLATED,compresslevel=9) as z:
              for f in ['meridian.py','Meridian.exe'] + [p.as_posix() for folder in ('assets','static') for p in (r/folder).rglob('*') if p.is_file()]:
                  z.write(f,f)
          '@ | python -
      - name: Build installer executable
        shell: pwsh
        run: |
          $env:GOOS="windows";$env:GOARCH="amd64";$env:CGO_ENABLED="0";$env:GO111MODULE="off"
          Push-Location installer-go
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../Meridian-Setup-0.2.7.exe .
          Pop-Location
      - name: Confirm installer PE format
        shell: pwsh
        run: |
          $f=Get-Item Meridian-Setup-0.2.7.exe
          if($f.Length -lt 1000000){throw "Installer unexpectedly small"}
          $bytes=[IO.File]::ReadAllBytes($f.FullName)
          if($bytes[0] -ne 77 -or $bytes[1] -ne 90){throw "Not a Windows PE executable"}
      - name: Install and smoke test on Windows
        shell: pwsh
        run: |
          $installer=Join-Path (Get-Location) 'Meridian-Setup-0.2.7.exe'
          $install=Start-Process -FilePath $installer -ArgumentList '--silent' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          $root=Join-Path $env:LOCALAPPDATA 'Programs/Meridian'
          foreach($f in @('Meridian.exe','meridian.py','runtime/python.exe','Uninstall-Meridian.exe','static/app.js','static/styles.css')) {
            if (-not (Test-Path (Join-Path $root $f))) { throw "Missing installed file: $f" }
          }
          $py=Join-Path $root 'runtime/python.exe'
          $app=Join-Path $root 'meridian.py'
          $proc=Start-Process -FilePath $py -ArgumentList @("`"$app`"",'--offline','--no-browser','--no-tray','--port','18765') -PassThru -WindowStyle Hidden
          try {
            $healthy=$false
            for($i=0;$i -lt 45;$i++) {
              Start-Sleep -Seconds 1
              try {
                $h=Invoke-RestMethod 'http://127.0.0.1:18765/api/health' -TimeoutSec 2
                if ($h.ok -and $h.version -eq '0.2.7') {$healthy=$true;break}
              } catch {}
            }
            if (-not $healthy) { throw 'Installed Meridian failed HTTP health check' }
            $state=Invoke-RestMethod 'http://127.0.0.1:18765/api/state'
            if (@($state.projects).Count -ne 3) { throw 'Expected 3 configured projects' }
            $note=@{project='latitude';title='Windows CI smoke test';body='Verified installation'} | ConvertTo-Json
            Invoke-RestMethod 'http://127.0.0.1:18765/api/notes' -Method Post -ContentType 'application/json' -Body $note | Out-Null
            $state=Invoke-RestMethod 'http://127.0.0.1:18765/api/state'
            if (-not ($state.notes | Where-Object title -eq 'Windows CI smoke test')) { throw 'Notes did not persist' }
          } finally { Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-Windows
          path: Meridian-Setup-0.2.7.exe
  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Meridian-Windows
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="v0.2.7"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" Meridian-Setup-0.2.7.exe --repo "$repo" --clobber
          else
            gh release create "$tag" Meridian-Setup-0.2.7.exe --repo "$repo" --target "${{ github.sha }}" --title "Meridian $tag" --notes "Windows installer built and smoke-tested on Windows. Changes include status lights, 48-hour checks, downloads, simplified goals, and repair prompts."
          fi
