name: Build, test and publish Meridian for Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: meridian-linux-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RPM packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          python -m pip install "Pillow>=11,<13"
      - name: Generate app icons
        run: python tools/generate_icons.py
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Build normal .deb and .rpm installers
        run: bash tools/build_linux_packages.sh
      - name: Validate built packages
        run: |
          dpkg-deb -I dist-linux/Meridian-0.2.15-all.deb
          dpkg-deb -c dist-linux/Meridian-0.2.15-all.deb | grep '/usr/bin/meridian'
          rpm -qpl dist-linux/Meridian-0.2.15-1.noarch.rpm | grep '/usr/bin/meridian'
      - name: Install Debian package and smoke-test its local API
        run: |
          sudo dpkg -i dist-linux/Meridian-0.2.15-all.deb
          test -f /usr/share/applications/meridian.desktop
          /usr/bin/meridian --offline --no-browser --no-tray --port 18766 > /tmp/meridian-linux.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18766/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; d=json.load(open("/tmp/health.json")); assert d.get("ok") is True and d.get("version")=="0.2.15", d'
          curl --fail --silent http://127.0.0.1:18766/api/auth/status > /tmp/auth.json
          python3 -c 'import json; a=json.load(open("/tmp/auth.json")); assert a["configured"] is False and a["authenticated"] is False'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18766/api/state)" = 401
      - name: Upload verified Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-Linux-v0.2.15
          path: |
            dist-linux/Meridian-0.2.15-all.deb
            dist-linux/Meridian-0.2.15-1.noarch.rpm
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Meridian-Linux-v0.2.15
      - name: Add Linux packages to public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for n in $(seq 1 40); do
            gh release view v0.2.15 --repo "$repo" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release view v0.2.15 --repo "$repo"
          gh release upload v0.2.15 Meridian-0.2.15-all.deb Meridian-0.2.15-1.noarch.rpm --repo "$repo" --clobber
